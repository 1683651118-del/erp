<div id="page-shipment">
    <div class="table-wrap">
        <div class="table-header">
            <div class="filter-group">
                <input type="text" class="form-control form-control-sm" placeholder="🔍 订单号" id="shipFilterOrderNo" oninput="renderShipment()" />
                <input type="text" class="form-control form-control-sm" placeholder="产品名称" id="shipFilterProduct" oninput="renderShipment()" />
                <select class="form-select form-select-sm" id="shipFilterStatus" onchange="renderShipment()">
                    <option value="">全部状态</option>
                    <option value="待出货">待出货</option>
                    <option value="已完成-待送货">已完成-待送货</option>
                    <option value="已送货完成">已送货完成</option>
                    <option value="已完成">已完成</option>
                </select>
                <select class="form-select form-select-sm" id="shipFilterQualityStatus" onchange="renderShipment()">
                    <option value="">全部质检状态</option>
                    <option value="质检完成-已送货">质检完成-已送货</option>
                    <option value="质检未通过-返单">质检未通过-返单</option>
                    <option value="已送货完成">已送货完成</option>
                </select>
                <button class="btn btn-sm btn-outline-custom" onclick="resetShipFilters()"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-custom btn-print" onclick="printShipments('delivery')" style="border-color:#0d6efd;color:#0d6efd;">
                    <i class="bi bi-printer"></i> 打印发货单
                </button>
                <button class="btn btn-sm btn-outline-custom btn-print" onclick="printShipments('label')" style="border-color:#198754;color:#198754;">
                    <i class="bi bi-tag"></i> 打印标签
                </button>
                <button class="btn btn-sm btn-outline-custom btn-add-column" onclick="openShipColumnSettings()"><i class="bi bi-layout-three-columns"></i> 列设置</button>
                <button class="btn btn-sm btn-outline-custom" onclick="resetShipColumns()"><i class="bi bi-arrow-counterclockwise"></i> 恢复列</button>
                <button class="btn btn-sm btn-outline-custom" onclick="exportShipmentsToExcel()" style="border-color:#0d6efd;color:#0d6efd;">
                    <i class="bi bi-file-earmark-excel"></i> 导出
                </button>
            </div>
        </div>
        <div class="table-responsive" id="shipTableWrapper">
            <table class="table" id="shipTable">
                <thead id="shipThead"></thead>
                <tbody id="shipBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ★★★ 注意：printPreviewModal 和 boxQtyModal 定义在 index.html 中，此处不再重复 ★★★ -->
<!-- 但 boxQtyModal 如果 index.html 没有，需要保留 -->
<div class="modal fade" id="boxQtyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-box-seam"></i> 输入每箱数量</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">本次送货总数量</label>
                    <div id="boxQtyTotal" style="font-size:20px;font-weight:700;color:#0066cc;"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">每箱装 <span style="color:#dc3545;">*</span></label>
                    <input type="number" class="form-control" id="boxQtyInput" min="1" step="1" placeholder="请输入每箱数量" />
                    <div class="form-text">系统将自动计算需要打印的标签张数</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">预计打印标签数</label>
                    <div id="boxQtyResult" style="font-size:18px;font-weight:700;color:#0a2540;">0 张</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary-custom" id="confirmBoxQtyBtn">生成标签</button>
            </div>
        </div>
    </div>
</div>

.col-resize-handle {

}

}

    position: fixed;

    width: 2px;

    pointer-events: none;
    display: none;

}
