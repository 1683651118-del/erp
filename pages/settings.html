<!-- ★★★ 本次送货数量输入模态框 ★★★ -->
<div class="modal fade" id="deliveryQtyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square"></i> 输入本次送货数量</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
                <div id="deliveryQtyList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary-custom" id="confirmDeliveryQtyBtn">确认打印</button>
            </div>
        </div>
    </div>
</div>
